{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ presentation.name }}</title>
    <link rel="stylesheet" href="{% static 'css/tv-player.css' %}">
</head>
<body class="tv-mode">
    <div id="tv-container" class="tv-container">
        <div id="tv-slide" class="tv-slide" style="transform: scale({{ display_scale_factor|default:1 }});">
            <div class="tv-loading">Cargando presentación...</div>
        </div>
    </div>
    <div id="tv-offline" class="tv-offline hidden">
        <p>Sin conexión. Reintentando...</p>
    </div>
    <script>
        window.CLOUD_SCREEN_TV = {
            dataUrl: "{{ data_url }}",
            controlUrl: "{{ control_url }}",
            presentationName: "{{ presentation.name|escapejs }}",
            displayScale: {{ display_scale|default:100 }},
        };
    </script>
    <script src="{% static 'js/tv-player.js' %}"></script>
</body>
</html>
